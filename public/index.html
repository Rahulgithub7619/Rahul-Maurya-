<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>श्री बालाजी टिफिन सर्विस | Shree Balaji Tiffin Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            saffron: {
              DEFAULT: '#FF6F00',
              50: '#FFF3E0',
              100: '#FFE0B2',
              500: '#FF6F00',
              600: '#E65100',
              700: '#BF360C'
            },
            indiagreen: {
              DEFAULT: '#2E7D32',
              50: '#E8F5E9',
              100: '#C8E6C9',
              600: '#2E7D32',
              700: '#1B5E20'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Main Container -->
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 dark:bg-slate-950 shadow-2xl relative flex flex-col pb-24">
    
    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full bg-saffron flex items-center justify-center text-white font-black text-xl shadow-md">
          🍱
        </div>
        <div>
          <h1 id="brand-title" class="font-extrabold text-base tracking-tight text-slate-900 dark:text-white leading-tight">श्री बालाजी टिफिन</h1>
          <p id="brand-subtitle" class="text-xs text-saffron font-bold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-indiagreen animate-ping inline-block"></span>
            जयपुर घर का स्वाद • Fresh Tiffins
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- APK Download Button -->
        <a href="/app-debug.apk" download class="bg-indiagreen hover:bg-indiagreen-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1 shadow transition">
          <span>📱</span> <span class="hidden sm:inline">APK</span>
        </a>

        <!-- Lang Switch -->
        <button onclick="toggleLang()" class="bg-slate-100 dark:bg-slate-800 text-saffron font-bold text-xs px-2 py-1.5 rounded-lg border border-saffron/20">
          <span id="lang-btn-text">EN</span>
        </button>

        <!-- Role Select -->
        <select id="role-select" onchange="changeRole(this.value)" class="bg-slate-100 dark:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-200 py-1.5 px-2 rounded-lg border border-slate-200 dark:border-slate-700 outline-none">
          <option value="CUSTOMER">👤 Customer</option>
          <option value="ADMIN">🛠️ Admin Portal</option>
          <option value="DELIVERY_BOY">🛵 Partner App</option>
        </select>
      </div>
    </header>

    <!-- Content Screen Area -->
    <main id="screen-container" class="flex-1 p-4 overflow-y-auto">
      <!-- Dynamic Screen Content rendered by JS -->
    </main>

    <!-- Bottom Navigation Bar (Customer Mode) -->
    <nav id="bottom-bar" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-2 py-2 flex items-center justify-around z-40">
      <button onclick="nav('home')" id="nav-home" class="flex flex-col items-center gap-1 text-saffron font-bold text-xs py-1 px-3 rounded-xl transition">
        <span class="text-lg">🏠</span>
        <span id="lbl-nav-home">Home</span>
      </button>
      <button onclick="nav('menu')" id="nav-menu" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 font-medium text-xs py-1 px-3 rounded-xl transition">
        <span class="text-lg">🍲</span>
        <span id="lbl-nav-menu">Menu</span>
      </button>
      <button onclick="nav('subscription')" id="nav-subscription" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 font-medium text-xs py-1 px-3 rounded-xl transition">
        <span class="text-lg">📅</span>
        <span id="lbl-nav-sub">Pass</span>
      </button>
      <button onclick="nav('cart')" id="nav-cart" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 font-medium text-xs py-1 px-3 rounded-xl transition relative">
        <span class="text-lg">🛒</span>
        <span id="lbl-nav-cart">Cart</span>
        <span id="cart-badge" class="absolute -top-1 right-1 bg-saffron text-white text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
      </button>
      <button onclick="nav('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 font-medium text-xs py-1 px-3 rounded-xl transition">
        <span class="text-lg">👤</span>
        <span id="lbl-nav-profile">Profile</span>
      </button>
    </nav>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div id="modal-content" class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative border border-slate-200 dark:border-slate-800">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <script>
    // App State
    let isHindi = false;
    let isDarkMode = false;
    let currentRole = 'CUSTOMER'; // CUSTOMER, ADMIN, DELIVERY_BOY
    let currentScreen = 'home'; // home, menu, subscription, cart, tracking, profile

    let walletBalance = 850;
    let cart = [];
    let appliedCoupon = null;
    let activeOrder = null;
    let adminActiveTab = 'menu'; // 'menu', 'inventory', 'calculator', 'notif'

    // Preset High Quality Food Photos for Quick Selection

    let meals = [
      {

        descriptionEn: "Paneer Butter Masala, Dal Makhani, Mix Veg, 4 Butter Roti, Jeera Rice, Gulab Jamun, Salad & Raita",
        descriptionHi: "पनीर बटर मसाला, दाल मखनी, मिक्स वेज, 4 बटर रोटी, जीरा राइस, गुलाब जामुन, रायता",
        price: 180,

      },

        descriptionHi: "4 देसी घी बाटी, पंचमेल दाल, मीठा चूरमा, लहसुन की चटनी और छाछ",
        price: 210,
        calories: 890,

        isAvailable: true,
        stockCount: 25
      },
      {
        id: "m3",
        titleEn: "Standard Mini Tiffin",
        titleHi: "स्टैंडर्ड मिनी टिफिन",
        descriptionEn: "Aloo Gobhi Sabzi, Yellow Dal Tadka, 3 Phulka Roti, Steamed Rice & Pickle",
        descriptionHi: "आलू गोभी सब्जी, पीली दाल तड़का, 3 फुल्का रोटी, चावल और अचार",
        price: 110,
        calories: 520,
        category: "MINI_MEAL",
        imageUrl: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=500&q=80",
        isAvailable: true,
        stockCount: 50
      },
      {
        id: "m4",
        titleEn: "High-Protein Fitness Thali",
        titleHi: "हाई-प्रोटीन फिटनेस थाली",
        descriptionEn: "Soya Chunk Curry, Boiled Chana Salad, 2 Multigrain Roti, Sprouts & Curd",
        descriptionHi: "सोया चंक करी, उबला चना सलाद, 2 मल्टीग्रेन रोटी, अंकुरित अनाज और दही",
        price: 160,
        calories: 480,
        category: "DIET_MEAL",
        imageUrl: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&q=80",
        isAvailable: true,
        stockCount: 20
      }
    ];

    // Kitchen Raw Material Inventory Data (कच्चा माल)
    let rawMaterials = [
      { id: "rm1", nameEn: "Atta (Wheat Flour)", nameHi: "गेहूं का आटा", stock: 45, unit: "kg", threshold: 15, costPerUnit: 40, icon: "🌾" },
      { id: "rm2", nameEn: "Desi Ghee", nameHi: "देसी घी", stock: 12, unit: "L", threshold: 5, costPerUnit: 650, icon: "🧈" },
      { id: "rm3", nameEn: "Fresh Paneer", nameHi: "ताजा पनीर", stock: 8, unit: "kg", threshold: 10, costPerUnit: 360, icon: "🧀" },
      { id: "rm4", nameEn: "Yellow & Toor Dal", nameHi: "दाल (तुअर/मूंग)", stock: 25, unit: "kg", threshold: 8, costPerUnit: 140, icon: "🫘" },
      { id: "rm5", nameEn: "Basmati Rice", nameHi: "बासमती चावल", stock: 30, unit: "kg", threshold: 10, costPerUnit: 90, icon: "🍚" },
      { id: "rm6", nameEn: "Fresh Milk & Curd", nameHi: "दूध और दही", stock: 18, unit: "L", threshold: 10, costPerUnit: 55, icon: "🥛" },
      { id: "rm7", nameEn: "Mustard & Refined Oil", nameHi: "कुकिंग ऑयल", stock: 22, unit: "L", threshold: 8, costPerUnit: 130, icon: "🛢️" },
      { id: "rm8", nameEn: "Indian Spices (Masale)", nameHi: "भारतीय मसाले", stock: 6, unit: "kg", threshold: 3, costPerUnit: 400, icon: "🌶️" }
    ];

    let subscriptions = [
      {
        id: "SUB-801",
        planNameEn: "Monthly Maharaja Thali Pass",
        planNameHi: "मासिक महाराजा थाली पास",
        mealSlot: "LUNCH",
        totalDays: 30,
        daysRemaining: 22,
        startDate: "2026-07-01",
        endDate: "2026-07-30",
        isPaused: false,
        skippedDates: ["2026-07-12"]
      }
    ];

    let orders = [
      {
        id: "BALAJI-9482",
        items: [{ titleEn: "Maharaja Special Thali", qty: 2, price: 180 }],
        totalAmount: 360,
        status: "OUT_FOR_DELIVERY",
        createdAt: "Today, 01:15 PM",
        estimatedDeliveryTime: "15-20 Mins",
        driverName: "Suresh Sharma 🛵",
        driverRating: 4.9,
        deliveryAddress: "Flat 402, Mansarovar, Jaipur"
      }
    ];

    // Initialize App
    function init() {
      render();
    }

    function toggleLang() {
      isHindi = !isHindi;
      document.getElementById('lang-btn-text').innerText = isHindi ? 'हिंदी' : 'EN';
      document.getElementById('brand-title').innerText = isHindi ? 'श्री बालाजी टिफिन सर्विस' : 'Shree Balaji Tiffin';
      document.getElementById('brand-subtitle').innerText = isHindi ? 'जयपुर घर का शुद्ध खाना' : 'Jaipur Home Style Food';
      
      document.getElementById('lbl-nav-home').innerText = isHindi ? 'होम' : 'Home';
      document.getElementById('lbl-nav-menu').innerText = isHindi ? 'मेन्यू' : 'Menu';
      document.getElementById('lbl-nav-sub').innerText = isHindi ? 'पास' : 'Pass';
      document.getElementById('lbl-nav-cart').innerText = isHindi ? 'कार्ट' : 'Cart';
      document.getElementById('lbl-nav-profile').innerText = isHindi ? 'प्रोफाइल' : 'Profile';

      render();
    }

    function changeRole(role) {
      currentRole = role;
      const bottomBar = document.getElementById('bottom-bar');
      if (role === 'CUSTOMER') {
        bottomBar.classList.remove('hidden');
      } else {
        bottomBar.classList.add('hidden');
      }
      render();
    }

    function nav(screen) {
      currentScreen = screen;
      ['home', 'menu', 'subscription', 'cart', 'profile'].forEach(s => {
        const el = document.getElementById(`nav-${s}`);
        if (el) {
          if (s === screen) {
            el.className = "flex flex-col items-center gap-1 text-saffron font-bold text-xs py-1 px-3 rounded-xl transition";
          } else {
            el.className = "flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 font-medium text-xs py-1 px-3 rounded-xl transition";
          }
        }
      });
      render();
    }

    function addToCart(mealId) {
      const meal = meals.find(m => m.id === mealId);
      if (!meal) return;
      const existing = cart.find(c => c.id === mealId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...meal, qty: 1 });
      }
      updateCartBadge();
      render();
    }

    function removeFromCart(mealId) {
      const existing = cart.find(c => c.id === mealId);
      if (existing) {
        existing.qty -= 1;
        if (existing.qty <= 0) {
          cart = cart.filter(c => c.id !== mealId);
        }
      }
      updateCartBadge();
      render();
    }

    function updateCartBadge() {
      const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
      const badge = document.getElementById('cart-badge');
      if (totalQty > 0) {
        badge.innerText = totalQty;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // Render dispatcher
    function render() {
      const container = document.getElementById('screen-container');
      
      if (currentRole === 'ADMIN') {
        container.innerHTML = renderAdminScreen();
        return;
      }

      if (currentRole === 'DELIVERY_BOY') {
        container.innerHTML = renderDeliveryBoyScreen();
        return;
      }

      switch(currentScreen) {
        case 'home':
          container.innerHTML = renderHomeScreen();
          break;
        case 'menu':
          container.innerHTML = renderMenuScreen();
          break;
        case 'subscription':
          container.innerHTML = renderSubscriptionScreen();
          break;
        case 'cart':
          container.innerHTML = renderCartScreen();
          break;
        case 'tracking':
          container.innerHTML = renderTrackingScreen();
          break;
        case 'profile':
          container.innerHTML = renderProfileScreen();
          break;
        default:
          container.innerHTML = renderHomeScreen();
      }
    }

    // HomeScreen UI
    function renderHomeScreen() {
      return `
        <div class="space-y-4">
          <!-- Banner Card -->
          <div class="bg-gradient-to-br from-saffron to-saffron-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
              <span class="bg-white/20 text-white text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                ${isHindi ? 'आज का विशेष टिफिन' : 'Today\'s Fresh Menu'}
              </span>
              <h2 class="text-xl font-black mt-2 leading-tight">
                ${isHindi ? 'शुद्ध देसी घी की महाराजा थाली' : 'Desi Ghee Maharaja Thali'}
              </h2>
              <p class="text-xs text-amber-100 mt-1">
                ${isHindi ? 'पनीर, दाल मखनी, रायता और 4 गरम फुल्के' : 'Paneer Masala, Dal Makhani, Curd & Hot Rotis'}
              </p>
              <button onclick="nav('menu')" class="mt-4 bg-white text-saffron-600 font-extrabold text-xs px-4 py-2 rounded-xl shadow hover:bg-amber-50 transition">
                ${isHindi ? 'अभी ऑर्डर करें - ₹180 ➔' : 'Order Now - ₹180 ➔'}
              </button>
            </div>
            <div class="absolute -right-4 -bottom-4 text-7xl opacity-20 select-none">🍲</div>
          </div>

          <!-- Subscription Banner Promo -->
          <div class="bg-indiagreen-50 dark:bg-slate-800 border border-indiagreen/20 rounded-2xl p-4 flex items-center justify-between">
            <div>
              <h3 class="font-bold text-sm text-indiagreen-700 dark:text-indiagreen-100">
                ${isHindi ? '30-दिनों का टिफिन पास - 20% बचाएं 🎁' : 'Monthly Tiffin Pass - Save 20% 🎁'}
              </h3>
              <p class="text-xs text-slate-600 dark:text-slate-400 mt-0.5">
                ${isHindi ? 'निःशुल्क होम डिलीवरी • कभी भी पॉज़ करें' : 'Free Home Delivery • Pause Anytime'}
              </p>
            </div>
            <button onclick="nav('subscription')" class="bg-indiagreen text-white font-bold text-xs px-3 py-2 rounded-xl">
              ${isHindi ? 'देखें' : 'View Pass'}
            </button>
          </div>

          <!-- Quick Active Order Card if exists -->
          ${orders.length > 0 ? `
            <div onclick="nav('tracking')" class="bg-white dark:bg-slate-900 border-2 border-saffron/40 rounded-2xl p-4 shadow-sm cursor-pointer hover:border-saffron transition">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-saffron flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-saffron animate-ping"></span>
                  ${isHindi ? 'ऑर्डर रास्ते में है #' + orders[0].id : 'Order Out for Delivery #' + orders[0].id}
                </span>
                <span class="text-xs font-semibold text-slate-500">${orders[0].estimatedDeliveryTime}</span>
              </div>
              <p class="text-xs font-medium text-slate-700 dark:text-slate-300 mt-1">
                ${orders[0].driverName} ${isHindi ? 'डिलीवर कर रहे हैं' : 'is delivering your tiffin'}
              </p>
            </div>
          ` : ''}

          <!-- Menu Section -->
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-extrabold text-base text-slate-900 dark:text-white">
                ${isHindi ? 'आज के व्यंजन 🍲' : 'Daily Fresh Meals 🍲'}
              </h3>
              <button onclick="nav('menu')" class="text-xs font-bold text-saffron">
                ${isHindi ? 'सब देखें ➔' : 'View All ➔'}
              </button>
            </div>

            <div class="space-y-3">
              ${meals.map(m => renderMealCard(m)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Helper Meal Card
    function renderMealCard(m) {
      const cartItem = cart.find(c => c.id === m.id);
      const qty = cartItem ? cartItem.qty : 0;
      const isOutOfStock = !m.isAvailable || (m.stockCount !== undefined && m.stockCount <= 0);

      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-3 border border-slate-200/80 dark:border-slate-800 flex gap-3 shadow-sm ${isOutOfStock ? 'opacity-75' : ''}">
          <img src="${m.imageUrl}" alt="${m.titleEn}" class="w-24 h-24 rounded-xl object-cover shrink-0" />
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-1">
                <h4 class="font-bold text-sm text-slate-900 dark:text-white leading-tight">
                  ${isHindi ? m.titleHi : m.titleEn}
                </h4>
                <span class="text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-slate-800 dark:text-amber-300 px-1.5 py-0.5 rounded shrink-0">
                  🔥 ${m.calories} kcal
                </span>
              </div>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">
                ${isHindi ? m.descriptionHi : m.descriptionEn}
              </p>
            </div>

            <div class="flex items-center justify-between mt-2">
              <div>
                <span class="font-extrabold text-base text-indiagreen">₹${m.price}</span>
                ${m.stockCount !== undefined ? `
                  <span class="text-[10px] font-bold block ${m.stockCount > 5 ? 'text-slate-400' : 'text-rose-500'}">
                    ${m.stockCount > 0 ? (isHindi ? `स्टॉक: ${m.stockCount} शेष` : `Stock: ${m.stockCount} left`) : (isHindi ? 'सोलड आउट' : 'Out of Stock')}
                  </span>
                ` : ''}
              </div>

              ${isOutOfStock ? `
                <span class="bg-slate-200 dark:bg-slate-800 text-slate-500 text-[11px] font-extrabold px-3 py-1.5 rounded-xl">
                  ${isHindi ? 'उपलब्ध नहीं' : 'UNAVAILABLE'}
                </span>
              ` : (qty === 0 ? `
                <button onclick="addToCart('${m.id}')" class="bg-saffron hover:bg-saffron-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow transition">
                  ${isHindi ? '+ जोड़ें' : '+ Add'}

          <div class="bg-gradient-to-r from-saffron/10 to-amber-500/10 border border-saffron/30 rounded-2xl p-3.5">
            <h3 class="font-extrabold text-xs text-saffron uppercase tracking-wider">Daily Kitchen Raw Material Estimator</h3>
            <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">Calculate total raw ingredients required for today's tiffin batch.</p>

            <div class="mt-3 flex items-center gap-2">
              <label class="text-xs font-bold text-slate-700 dark:text-slate-200">Target Tiffins:</label>
              <input type="number" value="${targetTiffins}" onchange="window.calculatorTiffinCount=parseInt(this.value)||100; render();" class="w-24 text-sm font-extrabold text-saffron p-1.5 rounded-xl border border-saffron/40 bg-white dark:bg-slate-900 text-center" />

              <span>Required Ingredients</span>
              <span>Status in Inventory</span>
            </h4>
            
            <div class="space-y-2 text-xs">
              ${estimates.map(e => {
                const required = (e.perTiffin * targetTiffins).toFixed(1);
                const currentRm = rawMaterials.find(r => r.id === e.rmId);
                const inStock = currentRm ? currentRm.stock : 0;
                const isDeficit = inStock < parseFloat(required);

                return `
                  <div class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-2">

                    </div>
                    <div class="text-right">
                      <p class="text-xs font-black ${isDeficit ? 'text-rose-600' : 'text-emerald-600'}">In Stock: ${inStock} ${e.unit}</p>
                      <span class="text-[10px] font-bold ${isDeficit ? 'text-rose-500' : 'text-slate-400'}">
                        ${isDeficit ? `⚠️ Need +${(parseFloat(required) - inStock).toFixed(1)} ${e.unit}` : '✓ Stock Ready'}
                      </span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function selectPresetPhoto(url) {
      document.getElementById('m-image').value = url;

    function saveMealForm(e, mealId) {
      e.preventDefault();
      const titleEn = document.getElementById('m-title-en').value;
      const titleHi = document.getElementById('m-title-hi').value;
      const price = parseFloat(document.getElementById('m-price').value) || 100;
      const stockCount = parseInt(document.getElementById('m-stock').value) || 0;
      const calories = parseInt(document.getElementById('m-calories').value) || 500;
      const category = document.getElementById('m-category').value;
      const imageUrl = document.getElementById('m-image').value;
      const descriptionEn = document.getElementById('m-desc-en').value;
      const descriptionHi = document.getElementById('m-desc-hi').value;
      const isAvailable = document.getElementById('m-available').checked;

      if (mealId) {
        const meal = meals.find(m => m.id === mealId);
        if (meal) {
          meal.titleEn = titleEn;
          meal.titleHi = titleHi;
          meal.price = price;
          meal.stockCount = stockCount;
          meal.calories = calories;
          meal.category = category;
          meal.imageUrl = imageUrl;
          meal.descriptionEn = descriptionEn;
          meal.descriptionHi = descriptionHi;
          meal.isAvailable = isAvailable;
        }
      } else {
        meals.push({
          id: "m" + Date.now(),
          titleEn,
          titleHi,
          price,
          stockCount,
          calories,
          category,
          imageUrl,
          descriptionEn,
          descriptionHi,
          isAvailable
        });
      }

      closeModal();
      render();
    }

    function saveRawMaterialForm(e, rmId) {
      e.preventDefault();
      const icon = document.getElementById('rm-icon').value || '📦';
      const nameEn = document.getElementById('rm-name-en').value;
      const nameHi = document.getElementById('rm-name-hi').value;
      const stock = parseFloat(document.getElementById('rm-stock').value) || 0;
      const unit = document.getElementById('rm-unit').value || 'kg';
      const threshold = parseFloat(document.getElementById('rm-threshold').value) || 5;
      const costPerUnit = parseFloat(document.getElementById('rm-cost').value) || 0;

      if (rmId) {
        const rm = rawMaterials.find(r => r.id === rmId);
        if (rm) {
          rm.icon = icon;
          rm.nameEn = nameEn;
          rm.nameHi = nameHi;
          rm.stock = stock;
          rm.unit = unit;
          rm.threshold = threshold;
          rm.costPerUnit = costPerUnit;
        }
      } else {
        rawMaterials.push({
          id: "rm" + Date.now(),
          icon,
          nameEn,
          nameHi,
          stock,
          unit,
          threshold,
          costPerUnit
        });
      }

      closeModal();
      render();
    }

    function deleteRawMaterial(rmId) {
      if (confirm("Are you sure you want to remove this raw material item from inventory?")) {
        rawMaterials = rawMaterials.filter(r => r.id !== rmId);
        closeModal();
        render();
      }
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    init();
  </script>
